<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astonish</title>
    <script type="module" crossorigin src="./assets/sidepanel-BUoCpOO3.js"></script>
    
    <link rel="stylesheet" crossorigin href="./assets/sidepanel-BCNlNdr3.css">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <span class="mark" aria-hidden="true"></span>
        <h1>Astonish</h1>
        <button id="logout" type="button" class="header-logout" hidden>Log out</button>
      </header>

      <section id="view-login" class="view is-active" data-view="login">
        <p class="lede">Sign in to Studio with SSO, the same way the terminal does.</p>
        <form id="login-form" class="form">
          <label>
            Studio URL
            <input
              id="server-url"
              name="serverUrl"
              type="url"
              placeholder="http://localhost:9393"
              autocomplete="url"
              required
            />
          </label>
          <button id="connect" type="submit">Sign in</button>
          <p id="login-status" class="hint" hidden></p>
          <div id="provider-picker" hidden>
            <p class="hint">Select SSO provider</p>
            <div id="provider-list" class="provider-list"></div>
          </div>
          <p id="login-error" class="error" hidden></p>
        </form>
      </section>

      <section id="view-chat" class="view" data-view="chat" hidden>
        <div class="session-bar">
          <select id="session-picker" aria-label="Extension sessions">
            <option value="">New chat</option>
          </select>
          <button id="delete-session" type="button" class="secondary" aria-label="Delete current session" title="Delete current session">🗑️</button>
        </div>
        <div class="chat-scroll">
          <p id="page-meta" class="page-meta" hidden></p>
          <p id="capture-banner" class="banner" hidden></p>
          <div id="transcript" class="transcript" aria-live="polite"></div>
        </div>
        <div id="apply-bar" class="apply-bar" hidden>
          <p class="apply-label">Apply to page</p>
          <pre id="apply-preview" class="apply-preview"></pre>
          <p id="apply-message" class="apply-message" hidden></p>
          <div class="apply-actions">
            <button id="apply" type="button">Apply</button>
            <button id="dismiss-apply" type="button" class="secondary">Dismiss</button>
          </div>
        </div>
        <div class="composer-wrap">
          <p id="status" class="status">Not connected</p>
          <form id="composer" class="composer">
            <button id="stop" type="button" class="stop-btn" hidden aria-label="Stop">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2" /></svg>
            </button>
            <textarea
              id="message"
              name="message"
              rows="1"
              placeholder="Say hi, or drop a task in here…"
              disabled
            ></textarea>
            <button id="send" type="submit" disabled aria-label="Send message">Send</button>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
