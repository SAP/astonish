apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "astonish.fullname" . }}-config
  labels:
    {{- include "astonish.labels" . | nindent 4 }}
data:
  config.yaml: |
    storage:
      backend: {{ .Values.config.storage.backend }}
      postgres:
        instance_suffix: {{ .Values.config.storage.postgres.instanceSuffix | quote }}
        max_open_conns: {{ .Values.config.storage.postgres.maxOpenConns }}
        max_idle_conns: {{ .Values.config.storage.postgres.maxIdleConns }}
        conn_max_lifetime_minutes: {{ .Values.config.storage.postgres.connMaxLifetimeMinutes }}
      auth:
        mode: {{ .Values.config.auth.mode }}
        {{- if .Values.config.auth.accessTokenTTLMinutes }}
        access_token_ttl_minutes: {{ .Values.config.auth.accessTokenTTLMinutes }}
        {{- end }}
        {{- if .Values.config.auth.refreshTokenTTLDays }}
        refresh_token_ttl_days: {{ .Values.config.auth.refreshTokenTTLDays }}
        {{- end }}
        {{- if not (kindIs "invalid" .Values.config.auth.allowRegistration) }}
        allow_registration: {{ .Values.config.auth.allowRegistration }}
        {{- end }}
        {{- if .Values.config.auth.defaultOrgName }}
        default_org_name: {{ .Values.config.auth.defaultOrgName | quote }}
        {{- end }}
        {{- if .Values.config.auth.defaultOrgSlug }}
        default_org_slug: {{ .Values.config.auth.defaultOrgSlug | quote }}
        {{- end }}
        {{- $oauth := .Values.config.auth.oauthServer | default dict }}
        {{- $oauthIssuer := $oauth.issuer | default "" }}
        {{- if and (eq $oauthIssuer "") .Values.ingress.enabled .Values.ingress.hosts (gt (len .Values.ingress.hosts) 0) }}
        {{- $scheme := "http" }}
        {{- if .Values.ingress.tls }}
        {{- $scheme = "https" }}
        {{- end }}
        {{- $oauthIssuer = printf "%s://%s" $scheme (index .Values.ingress.hosts 0).host }}
        {{- end }}
        {{- $oauthEnabled := true }}
        {{- if hasKey $oauth "enabled" }}
        {{- $oauthEnabled = $oauth.enabled }}
        {{- end }}
        oauth_server:
          enabled: {{ $oauthEnabled }}
          {{- if $oauthIssuer }}
          issuer: {{ $oauthIssuer | quote }}
          {{- if $oauth.resource }}
          resource: {{ $oauth.resource | quote }}
          {{- else }}
          resource: {{ printf "%s/api/mcp" (trimSuffix "/" $oauthIssuer) | quote }}
          {{- end }}
          {{- end }}
    {{- if .Values.sandbox.enabled }}
    sandbox:
      backend: {{ .Values.sandbox.backend | quote }}
      {{- with .Values.sandbox.limits }}
      limits:
        {{- if .cpu }}
        cpu: {{ .cpu }}
        {{- end }}
        {{- if .memory }}
        memory: {{ .memory | quote }}
        {{- end }}
        {{- if .processes }}
        processes: {{ .processes }}
        {{- end }}
        {{- with $.Values.sandbox.requests }}
        requests:
          {{- if .cpuMillis }}
          cpu_millis: {{ .cpuMillis }}
          {{- end }}
          {{- if .memoryMiB }}
          memory_mib: {{ .memoryMiB }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if eq .Values.sandbox.backend "k8s" }}
      kubernetes:
        in_cluster: true
        namespace: {{ include "astonish.namespace.sandbox" . | quote }}
        control_plane_namespace: {{ include "astonish.namespace.controlPlane" . | quote }}
        overlay_mode: {{ .Values.sandbox.overlay.mode | quote }}
        privileged_pods: {{ .Values.sandbox.overlay.privileged }}
        {{- if not (kindIs "invalid" .Values.sandbox.overlay.hostUsers) }}
        host_users: {{ .Values.sandbox.overlay.hostUsers }}
        {{- end }}
        {{- if .Values.sandbox.overlay.runtimeClassName }}
        runtime_class_name: {{ .Values.sandbox.overlay.runtimeClassName | quote }}
        {{- end }}
        {{- if .Values.sandbox.overlay.fuseDeviceResource }}
        fuse_device_resource: {{ .Values.sandbox.overlay.fuseDeviceResource | quote }}
        {{- end }}
        sandbox_image: {{ include "astonish.sandbox.image" . | quote }}
        layers_pvc_name: {{ .Values.sandbox.storage.layers.pvcName | quote }}
        uppers_pvc_name: {{ .Values.sandbox.storage.uppers.pvcName | quote }}
      {{- end }}
      {{- if eq .Values.sandbox.backend "openshell" }}
      openshell:
        gateway_addr: {{ include "astonish.openshell.gatewayAddr" . | quote }}
        gateway_tls: false
        sandbox_image: {{ printf "%s:%s" .Values.sandbox.openshell.image.repository .Values.sandbox.openshell.image.tag | quote }}
        {{- if .Values.sandbox.openshell.registry.url }}
        registry:
          url: {{ .Values.sandbox.openshell.registry.url | quote }}
          {{- if .Values.sandbox.openshell.registry.secretName }}
          secret_name: {{ .Values.sandbox.openshell.registry.secretName | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.sandbox.openshell.builder.image }}
        builder:
          image: {{ .Values.sandbox.openshell.builder.image | quote }}
          namespace: {{ default (include "astonish.namespace.controlPlane" .) .Values.sandbox.openshell.builder.namespace | quote }}
        {{- end }}
        {{- if .Values.sandbox.openshell.networkPolicy }}
        network_policy:
          {{- with .Values.sandbox.openshell.networkPolicy.presets }}
          presets:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.sandbox.openshell.networkPolicy.extraEndpoints }}
          extra_endpoints:
            {{- range . }}
            - host: {{ .host | quote }}
              {{- if .port }}
              port: {{ .port }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .Values.sandbox.openshell.landlockCompatibility }}
        landlock_compatibility: {{ .Values.sandbox.openshell.landlockCompatibility | quote }}
        {{- end }}
        {{- if .Values.sandbox.openshell.filesystemPolicy }}
        filesystem_policy:
          {{- with .Values.sandbox.openshell.filesystemPolicy.extraReadOnly }}
          extra_read_only:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.sandbox.openshell.filesystemPolicy.extraReadWrite }}
          extra_read_write:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- with .Values.sandbox.openshell.certBundles }}
        cert_bundles:
          {{- range . }}
          {{- $source := include "astonish.certBundle.source" . }}
          - name: {{ .name | quote }}
            source: {{ $source | quote }}
            {{- if eq $source "pvc" }}
            claim_name: {{ .claimName | quote }}
            {{- else }}
            config_map_name: {{ include "astonish.certBundle.configMapName" . | quote }}
            {{- if .claimName }}
            claim_name: {{ .claimName | quote }}
            {{- end }}
            {{- end }}
            mount_path: {{ .mountPath | quote }}
            {{- if .subPath }}
            sub_path: {{ .subPath | quote }}
            {{- end }}
            {{- if hasKey . "installSystemTrust" }}
            install_system_trust: {{ .installSystemTrust }}
            {{- end }}
            {{- with .trustEnv }}
            trust_env:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .Values.sandbox.openshell.idleTimeoutMinutes }}
        idle_timeout_minutes: {{ .Values.sandbox.openshell.idleTimeoutMinutes }}
        {{- end }}
      {{- end }}
    {{- end }}
